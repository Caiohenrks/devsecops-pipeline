services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: jenkins-docker:lts
    container_name: jenkins
    ports:
      - 8080:8080
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    networks:
      - devsecops-network
    environment:
      - JENKINS_OPTS=--httpPort=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    ports:
      - 8081:8081
      - 5000:8082
    volumes:
      - nexus_home:/nexus-data
    networks:
      - devsecops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    ports:
      - "8082:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    networks:
      - devsecops-network
    environment:
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:8082/
      - GITEA__security__ALLOWED_HOST_LIST=jenkins,private,loopback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  k3s-server:
    image: rancher/k3s:latest
    container_name: k3s-server
    restart: unless-stopped
    command:
      - server
      - --node-name=k3s-server
      - --flannel-iface=eth0
      - --disable-network-policy
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /var/run
    ports:
      - 6443:6443
      - 30080:30080
      - 30081:30081
      - 30082:30082
      - 30083:30083
    volumes:
      - k3s-server-data:/var/lib/rancher/k3s
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./k3s/registries.yaml:/etc/rancher/k3s/registries.yaml:ro
    networks:
      - devsecops-network
    environment:
      - K3S_KUBECONFIG_OUTPUT=/etc/rancher/k3s/k3s.yaml
      - K3S_KUBECONFIG_MODE=644
      - K3S_TOKEN=token
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1:6443/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  devsecops-network:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
  nexus_home:
    driver: local
  k3s-server-data:
    driver: local
  gitea-data:
    driver: local